# Super Agent 本地一键部署编排
#
# 约定：
#   1. 基础设施端口与 application.yaml 保持一致，容器之间通过服务名互相访问；
#   2. 所有镜像与数据卷都落在 Docker 数据盘（当前为 F:\Docker），不占用 C 盘；
#   3. 镜像 tag 全部固定，避免 latest 变动导致本地不可复现。
name: super-agent

services:
  mysql:
    image: mysql:8.0
    container_name: sa-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: super_agent_business_chat
      TZ: Asia/Shanghai
    ports:
      # 本机 3306 已被原生 MySQL 占用，这里换到 MYSQL_PORT，容器之间仍走 mysql:3306
      - "${MYSQL_PORT}:3306"
    volumes:
      - sa-mysql-data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: sa-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    ports:
      - "6378:6379"
    volumes:
      - sa-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.2
    container_name: sa-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      TZ: Asia/Shanghai
    ports:
      # 宿主机 9092 -> 容器 29092：让 IDE / 本地脚本按 application.yaml 默认的 127.0.0.1:9092 也能连上
      - "9092:29092"
    volumes:
      - sa-kafka-data:/var/lib/kafka/data

  elasticsearch:
    build:
      context: ./elasticsearch
    image: super-agent-elasticsearch:8.18.0-ik
    container_name: sa-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ES_PASSWORD}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9201:9200"
    volumes:
      - sa-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  neo4j:
    image: neo4j:5.26.4
    container_name: sa-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - sa-neo4j-data:/data

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: sa-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: super_agent_pgvector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - sa-pgvector-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d super_agent_pgvector"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: sa-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sa-minio-data:/data

  docling:
    # Docling 是 Python 服务，作为独立镜像接入；Java 后端通过 docling:5001 调用。
    build:
      context: ./docling
      args:
        DOCLING_BASE_IMAGE: ${DOCLING_BASE_IMAGE:-quay.nju.edu.cn/docling-project/docling-serve:v1.38.1}
    image: super-agent-docling:1.38.1
    container_name: sa-docling
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DOCLING_SERVE_ENABLE_UI: "true"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: /opt/app-root/src/.cache/huggingface
      DOCLING_SERVE_ARTIFACTS_PATH: /opt/app-root/src/.cache/docling/models
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    volumes:
      # 持久化 Docling / HuggingFace 模型缓存，避免重建容器后重复下载。
      - sa-docling-cache:/opt/app-root/src/.cache
    healthcheck:
      # /ready 会等待 Docling 模型加载完成，比只探测端口更可靠。
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ready', timeout=5).read()\" || python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ready', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 120s

  backend:
    # 后端容器改为可选：默认 docker compose up -d 不启动它，9082 留给 IDE 里的应用。
    # 需要整套跑在容器里时：docker compose --profile app up -d
    profiles: ["app"]
    build:
      context: ./backend
    image: super-agent-backend:0.0.1
    container_name: sa-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
      neo4j:
        condition: service_started
      minio:
        condition: service_started
      docling:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms512m -Xmx1536m -Dfile.encoding=UTF-8
      ALI_BAI_LIAN_API_KEY: ${ALI_BAI_LIAN_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SUPER_AGENT_ADMIN_USERNAME: ${SUPER_AGENT_ADMIN_USERNAME}
      SUPER_AGENT_ADMIN_PASSWORD: ${SUPER_AGENT_ADMIN_PASSWORD}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      APP_MANAGE_MINIO_ENDPOINT: http://minio:9000
      APP_MANAGE_PGVECTOR_HOST: pgvector
      APP_MANAGE_ELASTICSEARCH_URIS: http://elasticsearch:9200
      APP_MANAGE_NEO4J_URI: bolt://neo4j:7687
      DOCUMENT_STRUCTURE_PROVIDER: ${DOCUMENT_STRUCTURE_PROVIDER:-docling}
      DOCLING_SERVE_URL: http://docling:5001
      # Spring Boot 宽松绑定：对应 app.manage.structure-parsing.docling.*
      APP_MANAGE_STRUCTURE_PARSING_DOCLING_DO_OCR: ${DOCLING_DO_OCR:-false}
      APP_MANAGE_STRUCTURE_PARSING_DOCLING_OCR_ENGINE: ${DOCLING_OCR_ENGINE:-easyocr}
      APP_MANAGE_STRUCTURE_PARSING_DOCLING_TABLE_MODE: ${DOCLING_TABLE_MODE:-accurate}
    ports:
      - "9082:9082"
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
    image: super-agent-frontend:0.0.1
    container_name: sa-frontend
    restart: unless-stopped
    environment:
      # 后端上游：host.docker.internal=宿主机（IDE 或容器版后端都可），也可改成 backend:9082
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  sa-mysql-data:
  sa-redis-data:
  sa-kafka-data:
  sa-es-data:
  sa-neo4j-data:
  sa-pgvector-data:
  sa-minio-data:
  sa-docling-cache:
