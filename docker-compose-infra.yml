name: super-agent-infra

services:
  # Docling document conversion service
  # Java 侧通过 http://127.0.0.1:5001/v1/convert/file 调用。
  # 国内拉取 quay.io 较慢时默认走南京大学 quay 镜像（DaoCloud 未收录 docling-serve）：
  # DOCLING_SERVE_IMAGE=quay.nju.edu.cn/docling-project/docling-serve:v1.38.1
  docling-serve:
    container_name: sa-docling-serve
    image: ${DOCLING_SERVE_IMAGE:-quay.nju.edu.cn/docling-project/docling-serve:v1.38.1}
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      # Docling 模型从 HuggingFace 下载，国内默认走 hf-mirror。
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    restart: unless-stopped

  # PostgreSQL with PGVector
  pgvector:
    container_name: sa-pgvector
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: super_agent_pgvector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sa-pgvector-data:/var/lib/postgresql/data
    command: >
      -c shared_preload_libraries=vector
      -c listen_addresses='*'

  # Neo4j
  neo4j:
    container_name: sa-neo4j
    image: neo4j:5.26.4
    environment:
      NEO4J_AUTH: neo4j/12345678
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - sa-neo4j-data:/data

  # Milvus etcd
  milvus-etcd:
    container_name: sa-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - sa-etcd-data:/etcd

  # Milvus MinIO
  milvus-minio:
    container_name: sa-minio
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /data --console-address ":9001"
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - sa-minio-data:/data

  # Milvus standalone
  milvus:
    container_name: sa-milvus
    image: milvusdb/milvus:v2.6.6
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - sa-milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio

  # Milvus Attu GUI
  attu:
    container_name: sa-attu
    image: zilliz/attu:v2.6.3
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      - milvus

volumes:
  sa-pgvector-data:
  sa-neo4j-data:
  sa-etcd-data:
  sa-minio-data:
  sa-milvus-data:
